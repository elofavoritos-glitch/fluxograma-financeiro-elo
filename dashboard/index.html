<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxos Financeiros · ELO</title>
<link rel="preload" href="vendor/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("vendor/plus-jakarta-sans.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
:root{
  --bg:#f4f6fa; --surface:#ffffff; --ink:#0d1b2e; --ink-2:#475670; --ink-3:#8492a8;
  --line:#e5eaf2; --line-2:#d6deea;
  --navy:#0a1930; --navy-2:#102544;
  --brand:#0e9b6b; --brand-ink:#08744f; --brand-soft:#e7f6ef;
  --cr:#0e9b6b; --cr-soft:#e7f6ef; --cr-ink:#08744f;
  --cp:#3a5bd9; --cp-soft:#edf1ff; --cp-ink:#2d47b0;
  --fi:#d47706; --fi-soft:#fff3e2; --fi-ink:#9c5604;
  --bad:#d64545; --bad-soft:#fdeeee; --bad-line:#f5cfcf;
  --shadow-sm:0 1px 2px rgba(13,27,46,.05);
  --shadow:0 1px 2px rgba(13,27,46,.04),0 6px 20px rgba(13,27,46,.06);
  --shadow-lg:0 2px 6px rgba(13,27,46,.06),0 18px 44px rgba(13,27,46,.11);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:15px;line-height:1.5;display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}.i-xs{width:14px;height:14px}
.flip{transform:scaleX(-1)}

/* ---------- barra lateral ---------- */
.side{width:276px;flex:none;background:linear-gradient(180deg,var(--navy-2),var(--navy));color:#c9d5e8;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;padding:24px 22px 22px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.06em;color:#fff;
  background:linear-gradient(140deg,#14b07c,#0b8a5f);box-shadow:0 6px 16px rgba(14,155,107,.35)}
.brand-txt b{display:block;color:#fff;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand-txt small{display:block;color:#8299bd;font-size:12px;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:12px 0 24px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.nav-sec{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6c83a8;padding:18px 26px 7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.cr{background:var(--cr)}.dot.cp{background:#6d8bff}.dot.fi{background:#f0a23b}
.nav-item{display:flex;align-items:center;gap:11px;margin:2px 12px;padding:9px 14px;border-radius:10px;color:#b3c2da;font-size:14px;font-weight:500;transition:background .15s,color .15s}
.nav-item .i{opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(20,176,124,.16);color:#fff;box-shadow:inset 3px 0 0 #14b07c}
.nav-tag{margin-left:auto;font-size:10.5px;font-weight:700;color:#f6c27a;background:rgba(212,119,6,.18);padding:2px 7px;border-radius:20px}
.side-foot{padding:16px 24px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#6c83a8;line-height:1.55}

/* ---------- página ---------- */
main{flex:1;min-width:0}
.page{max-width:1180px;margin:0 auto;padding:34px 44px 64px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:18px}
.crumbs a:hover{color:var(--brand-ink)}
.crumb-sep{transform:rotate(-90deg);opacity:.6}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-ink)}
.eyebrow.cp{color:var(--cp-ink)}.eyebrow.fi{color:var(--fi-ink)}
h1{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin-top:4px}
.lead{font-size:16px;color:var(--ink-2);max-width:760px;margin-top:12px}
.title-row{display:flex;align-items:center;gap:16px}
.title-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.title-ico .i{width:26px;height:26px}
.title-ico.cr{background:var(--cr-soft);color:var(--cr-ink)}.title-ico.cp{background:var(--cp-soft);color:var(--cp-ink)}.title-ico.fi{background:var(--fi-soft);color:var(--fi-ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta-chip{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:5px 12px;border-radius:999px}

/* ---------- barra de ações ---------- */
.toolbar,.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar{margin:24px 0 16px}
.hero-actions{margin-top:22px}
.grow{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:11px;background:var(--surface);border:1px solid var(--line-2);
  font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .15s}
.tbtn:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.tbtn.on{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tbtn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.tbtn:disabled{opacity:.6;cursor:progress}

/* ---------- visão geral ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.route{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-sm)}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.route-steps{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.route-steps li{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.route-steps li .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:800}
.route-steps li+li::before{content:"";width:22px;height:2px;background:var(--line-2);border-radius:2px;margin-right:2px}
.area-block{margin-top:36px}
.area-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.area-head h2{font-size:20px;font-weight:800;letter-spacing:-.015em}
.area-head .count{font-size:13px;color:var(--ink-3);font-weight:600}
.area-badge{font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:8px}
.area-badge.cr{background:var(--cr-soft);color:var(--cr-ink)}.area-badge.cp{background:var(--cp-soft);color:var(--cp-ink)}.area-badge.fi{background:var(--fi-soft);color:var(--fi-ink)}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.proc-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow-sm);
  transition:transform .18s,box-shadow .18s,border-color .18s}
.proc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.pc-top{display:flex;align-items:center;justify-content:space-between}
.pc-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.pc-ico .i{width:22px;height:22px}
.pc-ico.cr{background:var(--cr-soft);color:var(--cr-ink)}.pc-ico.cp{background:var(--cp-soft);color:var(--cp-ink)}.pc-ico.fi{background:var(--fi-soft);color:var(--fi-ink)}
.status{font-size:12px;font-weight:700;color:var(--fi-ink);background:var(--fi-soft);padding:4px 10px;border-radius:999px}
.proc-card h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:14px}
.proc-card p{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--ks);color:var(--k)}
.chip.muted{background:#f0f3f7;color:var(--ink-3)}
.chain-arrow{color:var(--ink-3);width:13px;height:13px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px}
.pc-foot>span:first-child{font-size:13px;color:var(--ink-3);font-weight:600}
.go{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--brand-ink)}
.proc-card:hover .go .i{transform:translateX(3px)}
.go .i{transition:transform .18s}
.proc-card .chain{padding-bottom:2px}
.pc-foot{border-top:1px solid var(--line);margin-top:16px}

/* ---------- tipos de etapa ---------- */
.k-form{--k:#5b4bc4;--ks:#f0eefe;--kl:#d9d3fb}
.k-approval{--k:#b06d06;--ks:#fff4df;--kl:#f6dca6}
.k-exec{--k:#08744f;--ks:#e7f6ef;--kl:#b9e5d1}
.k-return{--k:#0b6a86;--ks:#e3f4f8;--kl:#b4dfea}
.k-dev{--k:#6b7a92;--ks:#f0f3f7;--kl:#dde3ec}

/* ---------- fluxo do processo ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.journey{display:flex;align-items:flex-start}
.step-wrap{flex:1 1 0;min-width:122px;max-width:232px;display:flex;flex-direction:column;gap:8px}
.step{position:relative;display:flex;flex-direction:column;gap:6px;width:100%;min-height:196px;padding:16px 15px 14px;background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .15s}
.step::before{content:"";position:absolute;left:16px;right:16px;top:-1.5px;height:3px;border-radius:0 0 3px 3px;background:var(--k);opacity:.9}
.step:hover{border-color:var(--k);box-shadow:var(--shadow);transform:translateY(-2px)}
.step:focus-visible{outline:3px solid var(--kl);outline-offset:2px}
.step.open{border-color:var(--k);box-shadow:0 0 0 4px var(--ks),var(--shadow)}
.step{container-type:inline-size}
.step-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 6px}
@container (max-width:120px){.kind{font-size:9px;letter-spacing:.02em}.step .num{width:20px;height:20px;font-size:11px}}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ks);color:var(--k);flex:none}
.kind{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--k);text-align:right;white-space:nowrap}
.step-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ks);color:var(--k);margin-top:6px}
.step-ico .i{width:21px;height:21px}
.step-title{font-size:15.5px;font-weight:700;line-height:1.3;letter-spacing:-.01em;margin-top:4px}
.step-sub{font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.4}
.step-end{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:12px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);padding:3px 9px;border-radius:999px;margin-top:4px}
.step-more{display:inline-flex;align-items:center;gap:4px;margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:700;color:var(--k)}
.step-more .i{transition:transform .2s}
.step.open .step-more .i{transform:rotate(180deg)}
.reject{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.35;color:var(--bad);background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:10px;padding:7px 9px}
.reject .i{margin-top:1px}
.conn{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:84px;color:#9fb0c9}
.conn-label{font-size:10px;font-weight:700;color:var(--brand-ink);min-height:15px;white-space:nowrap;letter-spacing:0}
.conn .i{width:22px;height:22px}

/* fluxo empilhado quando não cabe na largura */
.journey.vertical{flex-direction:column;align-items:stretch;max-width:600px;margin:0 auto}
.journey.vertical .step-wrap{max-width:none;min-width:0}
.journey.vertical .step{min-height:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ico top more" "ico title more" "ico sub more" "ico end more";column-gap:14px;row-gap:1px;align-items:center;padding:16px 18px}
.journey.vertical .step-ico{grid-area:ico;margin:0}
.journey.vertical .step-top{grid-area:top;justify-content:flex-start;gap:10px}
.journey.vertical .step-title{grid-area:title;margin:0}
.journey.vertical .step-sub{grid-area:sub}
.journey.vertical .step-end{grid-area:end}
.journey.vertical .step-more{grid-area:more;margin:0;padding:0}
.journey.vertical .conn{flex:0 0 auto;margin:0;height:46px;flex-direction:row;justify-content:center;gap:8px}
.journey.vertical .conn .i{transform:rotate(90deg)}
.journey.vertical .conn-label{min-height:0}

/* ---------- detalhes expandidos ---------- */
.details{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.hint-empty{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border:1.5px dashed var(--line-2);border-radius:14px;color:var(--ink-3);font-size:14px;font-weight:500}
.detail{border:1px solid var(--line);border-left:4px solid var(--k);border-radius:16px;background:#fbfcfe;padding:18px 20px;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--kl)}40%{box-shadow:0 0 0 6px var(--kl)}100%{box-shadow:0 0 0 0 transparent}}
.detail header{display:flex;align-items:center;gap:10px}
.detail h4{font-size:17px;font-weight:700;letter-spacing:-.01em}
.detail .kind{text-align:left}
.d-close{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.d-close:hover{background:#eef2f7;color:var(--ink)}
.d-desc{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:14px}
.group h5{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.fields{list-style:none;display:grid;gap:8px}
.fields li{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500}
.fields li .i{color:var(--k)}
.outcomes{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.oc{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 13px;border-radius:11px}
.oc.ok{background:var(--brand-soft);color:var(--brand-ink)}
.oc.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- regras, pontos em aberto, navegação ---------- */
.rules{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 22px;box-shadow:var(--shadow-sm)}
.rules h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.rules h3 .i{color:var(--brand)}
.rules ul{list-style:none;margin-top:10px;display:grid;gap:8px}
.rules li{position:relative;padding-left:18px;font-size:14.5px;color:var(--ink)}
.rules li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.open-points{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fffdf8}
.open-points summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 18px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--fi-ink)}
.open-points summary::-webkit-details-marker{display:none}
.open-points .cnt{background:var(--fi-soft);border-radius:999px;padding:0 8px;font-size:12px}
.open-points .chev{margin-left:auto;transition:transform .2s}
.open-points[open] .chev{transform:rotate(180deg)}
.open-points ul{padding:0 18px 14px 40px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pg{display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-weight:700;font-size:14px;transition:border-color .15s,box-shadow .15s}
.pg:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.pg small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.pg.next{text-align:right}

/* ---------- exportação e apresentação ---------- */
.export-area.exporting{padding:36px;background:var(--bg);width:1180px}
.export-area.exporting .page-head{padding-top:4px}
.pres-hint{display:none;position:fixed;right:18px;bottom:18px;z-index:5;background:rgba(10,25,48,.88);color:#dbe5f4;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:10px}
body.present .side,body.present .crumbs{display:none}
body.present .page{max-width:1440px;padding-top:30px}
body.present .pres-hint{display:block}

@media (max-width:900px){
  body{display:block}
  .side{position:static;width:auto;height:auto}
  .side-foot{display:none}
  .brand{padding:16px 18px}
  .nav{display:flex;overflow-x:auto;padding:8px 10px 12px;gap:4px}
  .nav-sec{display:none}
  .nav-item{flex:none;margin:0}
  .page{padding:22px 18px 48px}
  h1{font-size:26px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{padding:18px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{display:block;background:#fff}
  .side,.toolbar,.hero-actions,.pager,.crumbs,.open-points,.pres-hint,.d-close,.hint-empty{display:none!important}
  .page{max-width:none;padding:0}
  .board,.kpi,.proc-card,.rules,.step,.route{box-shadow:none!important}
  .step-wrap{min-width:0!important}
  .conn{flex-basis:34px!important}
  .conn-label{font-size:8px}
  .detail,.proc-card,.step-wrap,.rules{break-inside:avoid}
  .detail{animation:none}
}
</style>
</head>
<body>
<aside class="side">
  <a class="brand" href="#/">
    <span class="logo">ELO</span>
    <span class="brand-txt"><b>Fluxos Financeiros</b><small>Mapa de processos</small></span>
  </a>
  <nav class="nav" id="nav" aria-label="Processos"></nav>
  <div class="side-foot"><a href="editor.html" style="color:#8fd3b8;font-weight:600">✎ Editar fluxos</a><br><br>Baseado no quadro e nas anotações de planejamento.</div>
</aside>
<main id="main"><div id="view"></div></main>
<div class="pres-hint">← → troca de processo · Esc sai</div>

<script src="vendor/html-to-image.js"></script>
<script src="data.js"></script>
<script>
"use strict";
/* ---------- ícones (traço vetorial) ---------- */
const ICONS={
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  percent:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  banknote:'<rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  truck:'<path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  filex:'<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="m9.5 12.5 5 5M14.5 12.5l-5 5"/>',
  form:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',
  card:'<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  reply:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  expand:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  printer:'<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>',
  chevron:'<path d="m6 9 6 6 6-6"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic=(n,c="i")=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||""}</svg>`;

/* ---------- dados dos processos (fonte única: localStorage > data.js) ---------- */
let DATA = window.FLOW_DATA || {areas:[],processes:[]};
try{ const saved=localStorage.getItem("elo-fluxos"); if(saved) DATA=JSON.parse(saved); }catch(e){}
const AREAS = DATA.areas;
const AREA=Object.fromEntries(AREAS.map(a=>[a.id,a]));
const KIND={
  form:{label:"Formulário",icon:"form"},
  approval:{label:"Aprovação",icon:"shield"},
  exec:{label:"Execução",icon:"user"},
  return:{label:"Retorno",icon:"send"},
  dev:{label:"Em definição",icon:"clock"}
};

const P = DATA.processes;

/* ---------- utilitários ---------- */
const $=s=>document.querySelector(s);
const view=$("#view"), nav=$("#nav");
let cur=null, openStep=null, expandAll=false;
const plural=(n,s,p)=>`${n} ${n===1?s:p}`;
const approvals=p=>p.steps.filter(s=>s.type==="approval").length;

/* ---------- navegação lateral ---------- */
function renderNav(){
  nav.innerHTML=`<a class="nav-item ${cur?"":"active"}" href="#/">${ic("layers")}<span>Visão geral</span></a>`+
    AREAS.map(a=>`<div class="nav-sec"><span class="dot ${a.cls}"></span>${a.name}</div>`+
      P.filter(p=>p.area===a.id).map(p=>`<a class="nav-item ${cur&&cur.id===p.id?"active":""}" href="#/${p.id}">${ic(p.icon)}<span>${p.short}</span>${p.status?'<span class="nav-tag">em dev.</span>':""}</a>`).join("")
    ).join("");
}

/* ---------- visão geral ---------- */
function cardHTML(p){
  const a=AREA[p.area];
  let chips=p.steps.filter(s=>["approval","exec","return"].includes(s.type)).map(s=>`<span class="chip k-${s.type}">${s.title}</span>`);
  if(p.status) chips=[`<span class="chip k-dev">Em definição</span>`];
  else if(!approvals(p)) chips.unshift(`<span class="chip muted">Sem aprovação</span>`);
  const info=[plural(p.steps.length,"etapa","etapas"),p.fields?plural(p.fields,"campo","campos"):null].filter(Boolean).join(" · ");
  return `<a class="proc-card" href="#/${p.id}">
    <div class="pc-top"><span class="pc-ico ${a.cls}">${ic(p.icon)}</span>${p.status?`<span class="status">${p.status}</span>`:`<span class="area-badge ${a.cls}">${a.short}</span>`}</div>
    <h3>${p.title}</h3><p>${p.summary}</p>
    <div class="chain">${chips.join(ic("arrow","i chain-arrow"))}</div>
    <div class="pc-foot"><span>${info}</span><span class="go">Ver fluxo${ic("arrow","i i-sm")}</span></div>
  </a>`;
}
function renderOverview(){
  const ativos=P.filter(p=>!p.status);
  const dupla=ativos.filter(p=>approvals(p)===2).length;
  const sem=ativos.filter(p=>approvals(p)===0).length;
  const kpi=(l,v)=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`;
  const rota=["Solicitação","Área: CR, CP ou Fiscal","Formulário do processo","Aprovações","Execução e retorno"];
  view.innerHTML=`<div class="page"><div id="exportArea" class="export-area">
    <header class="page-head">
      <div class="eyebrow">ELO · Financeiro</div>
      <h1>Fluxos Financeiros</h1>
      <p class="lead">Como cada solicitação de Contas a Receber, Contas a Pagar e Fiscal é preenchida, aprovada e executada. Clique num processo para ver o fluxo completo.</p>
      <div class="hero-actions no-export">
        <button class="tbtn" data-act="present">${ic("expand","i i-sm")}<span class="lbl">Apresentar</span></button>
        <button class="tbtn primary" id="btnPng" data-act="png">${ic("download","i i-sm")}<span class="lbl">Baixar imagem</span></button>
      </div>
    </header>
    <section class="kpis">${kpi("Áreas",AREAS.length)}${kpi("Processos",P.length)}${kpi("Com 2 aprovações",dupla)}${kpi("Sem aprovação",sem)}</section>
    <section class="route"><h2 class="sec-title">Como uma solicitação anda</h2>
      <ol class="route-steps">${rota.map((t,i)=>`<li><span class="num">${i+1}</span>${t}</li>`).join("")}</ol></section>
    ${AREAS.map(a=>{const ps=P.filter(p=>p.area===a.id);return `<section class="area-block">
      <div class="area-head"><span class="area-badge ${a.cls}">${a.short}</span><h2>${a.name}</h2><span class="count">${plural(ps.length,"processo","processos")}</span></div>
      <div class="proc-grid">${ps.map(cardHTML).join("")}</div></section>`;}).join("")}
  </div></div>`;
}

/* ---------- página do processo ---------- */
const conn=l=>`<div class="conn" aria-hidden="true"><span class="conn-label">${l}</span>${ic("arrow")}</div>`;
function journeyHTML(p){
  const out=[];
  p.steps.forEach((s,i)=>{
    const k=KIND[s.type], last=i===p.steps.length-1;
    out.push(`<div class="step-wrap"><button type="button" class="step k-${s.type}" data-i="${i}" aria-expanded="false">
      <span class="step-top"><span class="num">${i+1}</span><span class="kind">${k.label}</span></span>
      <span class="step-ico">${ic(s.icon||k.icon)}</span>
      <span class="step-title">${s.title}</span>
      <span class="step-sub">${s.sub||""}</span>
      ${last&&s.done?`<span class="step-end">${ic("check","i i-xs")}Concluído</span>`:""}
      <span class="step-more">Detalhes${ic("chevron","i i-xs")}</span>
    </button>${s.reject?`<div class="reject">${ic("undo","i i-xs")}<span><b>Recusado:</b> ${s.reject}</span></div>`:""}</div>`);
    if(!last) out.push(conn(s.type==="approval"?"Aprovado":""));
  });
  return out.join("");
}
function detailHTML(p,i,closable){
  const s=p.steps[i], k=KIND[s.type], next=p.steps[i+1];
  let body=`<p class="d-desc">${s.desc||""}</p>`;
  if(s.groups) body+=`<div class="groups">${s.groups.map(g=>`<div class="group"><h5>${g.label}</h5><ul class="fields">${g.fields.map(f=>`<li>${ic("check","i i-xs")}<span>${f}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
  if(s.type==="approval") body+=`<div class="outcomes">
      <div class="oc ok">${ic("check","i i-sm")}<span><b>Aprovado:</b> segue para a etapa ${i+2}${next?` (${next.title})`:""}</span></div>
      <div class="oc bad">${ic("undo","i i-sm")}<span><b>Recusado:</b> ${s.reject}</span></div></div>`;
  return `<article class="detail k-${s.type}" id="d${i}">
    <header><span class="num">${i+1}</span><span class="kind">${k.label}</span><h4>${s.title}</h4>
    ${closable?`<button type="button" class="d-close no-export" data-close="${i}" aria-label="Fechar">${ic("x","i i-sm")}</button>`:""}</header>
    ${body}</article>`;
}
function renderDetails(){
  if(!cur) return;
  const idx=expandAll?cur.steps.map((_,i)=>i):(openStep===null?[]:[openStep]);
  $("#details").innerHTML=idx.length?idx.map(i=>detailHTML(cur,i,!expandAll)).join(""):
    `<div class="hint-empty no-export">${ic("search","i i-sm")}Clique em uma etapa para ver os campos e as regras.</div>`;
  view.querySelectorAll(".step").forEach(b=>{const on=idx.includes(+b.dataset.i);b.classList.toggle("open",on);b.setAttribute("aria-expanded",String(on));});
  const be=$("#btnExpand");
  if(be){be.querySelector(".lbl").textContent=expandAll?"Recolher tudo":"Expandir tudo";be.classList.toggle("on",expandAll);}
}
function pager(p){
  const i=P.indexOf(p), pr=P[i-1], nx=P[i+1];
  return `<nav class="pager no-export">${pr?`<a class="pg" href="#/${pr.id}">${ic("arrow","i i-sm flip")}<span><small>Anterior</small>${pr.short}</span></a>`:"<span></span>"}${nx?`<a class="pg next" href="#/${nx.id}"><span><small>Próximo</small>${nx.short}</span>${ic("arrow","i i-sm")}</a>`:"<span></span>"}</nav>`;
}
function renderProcess(p){
  const a=AREA[p.area], n=approvals(p);
  const meta=[plural(p.steps.length,"etapa","etapas"),p.status?p.status:(n?plural(n,"aprovação","aprovações"):"Sem aprovação"),p.fields?plural(p.fields,"campo","campos"):null]
    .filter(Boolean).map(t=>`<span class="meta-chip">${t}</span>`).join("");
  const rules=p.rules.length?`<section class="rules"><h3>${ic("check","i i-sm")}Regras do processo</h3><ul>${p.rules.map(r=>`<li>${r}</li>`).join("")}</ul></section>`:"";
  const open=p.open.length?`<details class="open-points"><summary>${ic("help","i i-sm")}Pontos em aberto <span class="cnt">${p.open.length}</span>${ic("chevron","i i-sm chev")}</summary><ul>${p.open.map(o=>`<li>${o}</li>`).join("")}</ul></details>`:"";
  view.innerHTML=`<div class="page">
    <nav class="crumbs" aria-label="Você está em"><a href="#/">Visão geral</a>${ic("chevron","i i-xs crumb-sep")}<span>${a.name}</span></nav>
    <div id="exportArea" class="export-area">
      <header class="page-head">
        <div class="title-row"><span class="title-ico ${a.cls}">${ic(p.icon)}</span>
          <div><div class="eyebrow ${a.cls}">${a.name}</div><h1>${p.title}</h1></div></div>
        <p class="lead">${p.summary}</p>
        <div class="meta">${meta}</div>
      </header>
      <div class="toolbar no-export">
        <button type="button" class="tbtn" id="btnExpand" data-act="expand">${ic("list","i i-sm")}<span class="lbl">Expandir tudo</span></button>
        <span class="grow"></span>
        <button type="button" class="tbtn" data-act="present">${ic("expand","i i-sm")}<span class="lbl">Apresentar</span></button>
        <button type="button" class="tbtn" data-act="print">${ic("printer","i i-sm")}<span class="lbl">PDF</span></button>
        <button type="button" class="tbtn primary" id="btnPng" data-act="png">${ic("download","i i-sm")}<span class="lbl">Baixar imagem</span></button>
      </div>
      <section class="board">
        <div class="journey" id="journey">${journeyHTML(p)}</div>
        <div class="details" id="details"></div>
      </section>
      ${rules}
    </div>
    ${open}
    ${pager(p)}
  </div>`;
  renderDetails();
}

/* ---------- fluxo cabe na largura? senão empilha (nunca corta) ---------- */
function layoutJourney(){
  const j=document.getElementById("journey"); if(!j) return;
  j.classList.remove("vertical");
  j.classList.toggle("vertical", j.scrollWidth>j.clientWidth+2);
}
let lastW=0;
new ResizeObserver(e=>{const w=Math.round(e[0].contentRect.width);if(w!==lastW){lastW=w;layoutJourney();}}).observe($("#main"));

/* ---------- interações ---------- */
function onStep(i){
  if(expandAll){const d=document.getElementById("d"+i);if(d){d.scrollIntoView({behavior:"smooth",block:"center"});d.classList.remove("flash");void d.offsetWidth;d.classList.add("flash");}return;}
  openStep=openStep===i?null:i; renderDetails();
  if(openStep!==null){const d=document.getElementById("d"+i);d&&d.scrollIntoView({behavior:"smooth",block:"nearest"});}
}
view.addEventListener("click",e=>{
  const st=e.target.closest(".step"); if(st){onStep(+st.dataset.i);return;}
  if(e.target.closest("[data-close]")){openStep=null;renderDetails();return;}
  const act=e.target.closest("[data-act]"); if(!act) return;
  const a=act.dataset.act;
  if(a==="expand"){expandAll=!expandAll;openStep=null;renderDetails();}
  else if(a==="present") togglePresent();
  else if(a==="print") window.print();
  else if(a==="png") exportPng();
});

/* ---------- imagem em alta resolução ---------- */
async function snapshot(ratio){
  const prevAll=expandAll, prevOpen=openStep;
  if(cur){expandAll=true;renderDetails();}
  const node=$("#exportArea"); node.classList.add("exporting"); layoutJourney();
  try{
    await document.fonts.ready;
    return await htmlToImage.toPng(node,{pixelRatio:ratio||3,backgroundColor:"#f4f6fa",cacheBust:true,
      filter:n=>!(n.classList&&n.classList.contains("no-export"))});
  }finally{
    node.classList.remove("exporting");
    if(cur){expandAll=prevAll;openStep=prevOpen;renderDetails();}
    layoutJourney();
  }
}
async function exportPng(){
  const btn=$("#btnPng"), lbl=btn.querySelector(".lbl"), old=lbl.textContent;
  btn.disabled=true; lbl.textContent="Gerando…";
  try{
    const url=await snapshot(3);
    const a=document.createElement("a"); a.href=url; a.download=`fluxo-${cur?cur.id:"visao-geral"}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(err){alert("Não foi possível gerar a imagem: "+(err&&err.message||err));}
  finally{btn.disabled=false; lbl.textContent=old;}
}
window.snapshot=snapshot;

/* ---------- modo apresentação ---------- */
function togglePresent(){
  if(document.body.classList.contains("present")){document.fullscreenElement?document.exitFullscreen():document.body.classList.remove("present");return;}
  document.body.classList.add("present");
  document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});
  setTimeout(layoutJourney,80);
}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("present");setTimeout(layoutJourney,80);});
document.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("present")) return;
  if(e.key==="Escape"){document.body.classList.remove("present");setTimeout(layoutJourney,80);return;}
  const i=cur?P.indexOf(cur):-1;
  if(e.key==="ArrowRight"&&i<P.length-1) location.hash="#/"+P[i+1].id;
  if(e.key==="ArrowLeft"){if(i>0) location.hash="#/"+P[i-1].id; else if(i===0) location.hash="#/";}
});

/* ---------- PDF: imprime com tudo expandido ---------- */
let printPrev=null;
window.addEventListener("beforeprint",()=>{if(cur){printPrev=[expandAll,openStep];expandAll=true;renderDetails();}});
window.addEventListener("afterprint",()=>{if(cur&&printPrev){[expandAll,openStep]=printPrev;printPrev=null;renderDetails();}});

/* ---------- rotas ---------- */
function route(){
  const id=(location.hash.match(/^#\/([\w-]+)/)||[])[1];
  cur=P.find(x=>x.id===id)||null; openStep=null; expandAll=false;
  cur?renderProcess(cur):renderOverview();
  renderNav();
  document.title=cur?`${cur.title} · Fluxos Financeiros ELO`:"Fluxos Financeiros · ELO";
  window.scrollTo(0,0);
  requestAnimationFrame(layoutJourney);
}
window.addEventListener("hashchange",route);
/* prévia ao vivo do editor: recebe novos dados e re-renderiza */
window.addEventListener("message",ev=>{
  const m=ev.data; if(!m||m.type!=="elo-data"||!m.data) return;
  DATA=m.data; AREAS.length=0; m.data.areas.forEach(a=>AREAS.push(a));
  for(const k in AREA) delete AREA[k]; m.data.areas.forEach(a=>AREA[a.id]=a);
  P.length=0; m.data.processes.forEach(p=>P.push(p));
  if(cur) cur=P.find(x=>x.id===cur.id)||null;
  route();
});
if(document.fonts) document.fonts.ready.then(layoutJourney);
route();
</script>
</body>
</html>
